[package]
name = "frontier-editor"
description = "Host-agnostic editor core: rope document, multi-cursor selections, undo tree, tree-sitter syntax, hunks with per-hunk accept/reject, JSON-Schema diagnostics and provenance events"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true

[dependencies]
ropey = "1.6"
regex = "1.11"
similar = "3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
hex = "0.4"
unicode-segmentation = "1.12"
unicode-width = "0.2"
jsonschema = { version = "0.50", default-features = false, optional = true }
yaml-rust2 = { version = "0.13", optional = true }
toml_edit = { version = "0.23", optional = true }
glob = { workspace = true, optional = true }
schemars = { version = "1.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# tree-sitter's C runtime needs a libc sysroot, which wasm32-unknown-unknown does not have.
# On wasm the built-in lexer-based tokenizer is used instead (see `syntax::fallback`).
tree-sitter = { version = "0.27", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-matlab = { version = "1.3", optional = true }

[features]
default = ["schema", "lang-json", "lang-yaml", "lang-toml", "lang-python", "lang-markdown"]
# JSON-Schema validation of JSON / YAML / TOML documents with ranges.
schema = ["dep:jsonschema", "dep:yaml-rust2", "dep:toml_edit", "dep:glob"]
# Export the core's own event / state types as JSON Schema (used by the schema exporter).
schemars = ["dep:schemars"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
lang-json = ["tree-sitter", "dep:tree-sitter-json"]
lang-yaml = ["tree-sitter", "dep:tree-sitter-yaml"]
lang-toml = ["tree-sitter", "dep:tree-sitter-toml-ng"]
lang-python = ["tree-sitter", "dep:tree-sitter-python"]
lang-markdown = ["tree-sitter", "dep:tree-sitter-md"]
lang-rust = ["tree-sitter", "dep:tree-sitter-rust"]
lang-shell = ["tree-sitter", "dep:tree-sitter-bash"]
lang-java = ["tree-sitter", "dep:tree-sitter-java"]
lang-matlab = ["tree-sitter", "dep:tree-sitter-matlab"]
# No permissive Tcl grammar is published on crates.io (2026-10); Tcl uses the fallback lexer.
all-languages = ["lang-json", "lang-yaml", "lang-toml", "lang-python", "lang-markdown", "lang-rust", "lang-shell", "lang-java", "lang-matlab"]

[dev-dependencies]
serde_json.workspace = true

[[bench]]
name = "core"
harness = false
