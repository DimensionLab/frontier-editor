# Generated by DimensionLab's export tooling. Dependency versions are managed upstream;
# propose changes to member crates, not to this file.
[workspace]
resolver = "3"
members = ["crates/frontier-editor-view/", "crates/frontier-editor/"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["DimensionLab <hello@dimensionlab.org>"]
repository = "https://github.com/DimensionLab/frontier-editor"
homepage = "https://dimensionlab.org"

[workspace.dependencies]
glob = "0.3"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = "30"
